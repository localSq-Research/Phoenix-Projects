<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#27272A" />
      <stop offset="100%" stop-color="#09090B" />
    </radialGradient>
    
    <!-- Accent Gradient for the ZTP Monogram -->
    <linearGradient id="ztpGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAFAFA" />
      <stop offset="100%" stop-color="#D4D4D8" />
    </linearGradient>

    <!-- Amber Glow for the Orbital Mark -->
    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Drop Shadow for Depth -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Discord Profile Squircle / Rounded Backdrop -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Subtle Industrial Border Ring -->
  <rect x="24" y="24" width="464" height="464" rx="92" fill="none" stroke="#3F3F46" stroke-width="4" stroke-opacity="0.4" />

  <!-- Main Monogram Group -->
  <g filter="url(#shadow)" transform="translate(0, -10)">
    <!-- ZTP Letters Path (Geometric, Bold, Industrial) -->
    <path d="
      M 130 160 
      H 230 
      L 145 280 
      H 230
      
      M 260 160
      H 360
      M 310 160
      V 340
      
      M 390 160
      H 430
      C 465 160 465 250 430 250
      H 390
      V 340
      M 390 205
      H 425
    " 
    fill="none" 
    stroke="url(#ztpGrad)" 
    stroke-width="32" 
    stroke-linecap="square" 
    stroke-linejoin="miter" />
  </g>

  <!-- Orbital Symbol Sequence (° . •) -->
  <g transform="translate(0, 30)">
    <!-- Degree Circle (°): Amber Glow -->
    <circle cx="170" cy="385" r="14" fill="none" stroke="url(#amberGlow)" stroke-width="6" />
    
    <!-- Middle Dot (.) -->
    <circle cx="230" cy="385" r="7" fill="#A1A1AA" />
    
    <!-- Final Solid Point (•) -->
    <circle cx="280" cy="385" r="11" fill="#FAFAFA" />
  </g>

</svg>
